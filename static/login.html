<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal — Sign in</title>
<link rel="stylesheet" href="/static/style.css">
<script>document.documentElement.dataset.theme =
  localStorage.journal_theme ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
</script>
</head>
<body class="login-body">
<main class="login-card">
  <h1>Journal</h1>
  <p class="login-sub">Enter your password to continue.</p>
  <form id="login-form">
    <input type="password" id="login-password" placeholder="Password"
           autocomplete="current-password" required>
    <button type="submit" class="create-btn" id="login-btn">Sign in</button>
  </form>
  <p id="login-error" class="login-error" role="alert"></p>
</main>
<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("login-btn");
  const err = document.getElementById("login-error");
  err.textContent = "";
  btn.disabled = true;
  try {
    const r = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("login-password").value })
    });
    if (r.ok) { location.href = "/"; return; }
    const d = await r.json().catch(() => ({}));
    err.textContent = d.detail || "Sign in failed.";
  } catch {
    err.textContent = "Could not reach the server.";
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
